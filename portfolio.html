<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Portfolio | RK Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #D32F2F;
            --red-dark: #B71C1C;
            --red-light: #FF5252;
            --bg: #050505;
            --card-bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .syne {
            font-family: 'Syne', sans-serif;
        }

        /* Dynamic Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            background-image: 
                linear-gradient(rgba(211, 47, 47, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 47, 47, 0.3) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.25; }
        }

        /* Floating Red Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--red);
            border-radius: 50%;
            opacity: 0.4;
            animation: float 15s infinite;
            box-shadow: 0 0 10px var(--red);
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 3px;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(211, 47, 47, 0.2);
            padding: 14px 24px;
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--red); }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .nav-r {
            width: 28px;
            height: 28px;
            background: var(--red);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.5);
        }

        .hire-btn {
            font-size: 0.8rem;
            border: 1px solid var(--red);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
            background: transparent;
        }
        .hire-btn:hover {
            background: var(--red);
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4);
        }

        /* Hero Section */
        .hero {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0.7) 50%, var(--bg) 100%);
            border-bottom: 1px solid rgba(211, 47, 47, 0.2);
            padding: 80px 24px 60px;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--red);
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 16px;
            padding: 8px 16px;
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 100px;
            background: rgba(211, 47, 47, 0.1);
        }

        .hero-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--red);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(211, 47, 47, 0.3);
        }

        .hero p {
            color: #9ca3af;
            font-size: 1rem;
            max-width: 480px;
            margin: 0 auto 36px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .stat-box {
            background: rgba(17, 17, 17, 0.8);
            border: 1px solid rgba(211, 47, 47, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .stat-box:hover {
            border-color: var(--red);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.2);
        }

        .stat-num {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--red);
            text-shadow: 0 0 20px rgba(211, 47, 47, 0.5);
        }

        .stat-lbl {
            font-size: 0.65rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 6px;
        }

        /* Filter Bar */
        .fbar {
            position: sticky;
            top: 57px;
            z-index: 40;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(211, 47, 47, 0.2);
            padding: 16px 24px;
        }

        .fbar-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .fbar-inner::-webkit-scrollbar { display: none; }

        .pill {
            padding: 10px 24px;
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            background: transparent;
            color: #888;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .pill:hover, .pill.active {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4);
        }

        /* Main Grid */
        main {
            position: relative;
            z-index: 10;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            align-items: start;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(211, 47, 47, 0.15);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(211, 47, 47, 0.5);
            box-shadow: 0 20px 40px rgba(211, 47, 47, 0.15);
        }
        .card:hover::before {
            opacity: 1;
        }

        .card.portrait {
            grid-row: span 2;
        }

        /* Thumbnail */
        .thumb {
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        .thumb img, .thumb-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s;
        }
        .card:hover .thumb img, .card:hover .thumb-video {
            transform: scale(1.08);
        }

        /* Gradient Overlay */
        .grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
            pointer-events: none;
        }

        /* Badges */
        .cat-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(211, 47, 47, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        }

        .ratio-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #aaa;
            font-family: monospace;
        }

        .dur-tag {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            font-family: monospace;
            border: 1px solid rgba(211, 47, 47, 0.3);
        }

        /* Play Button */
        .play-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-circ {
            width: 64px;
            height: 64px;
            background: rgba(211, 47, 47, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .card:hover .play-circ {
            background: var(--red);
            border-color: var(--red);
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.6);
        }

        /* Card Body */
        .card-body {
            padding: 20px;
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .card-desc {
            color: #6b7280;
            font-size: 0.85rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Empty State */
        #empty {
            display: none;
            padding: 100px 0;
            text-align: center;
            color: #4b5563;
        }

        /* Modal */
        #modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        #modal.open { display: flex; }

        #mbox {
            position: relative;
            width: 100%;
            margin: auto;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(211, 47, 47, 0.3);
        }

        #mbox.landscape { max-width: 960px; }
        #mbox.portrait { max-width: 420px; }

        #mbox iframe, #mbox video {
            width: 100%;
            display: block;
            border: none;
        }

        #mbox.landscape iframe, #mbox.landscape video { aspect-ratio: 16/9; }
        #mbox.portrait iframe, #mbox.portrait video { aspect-ratio: 9/16; max-height: 80vh; }

        #mmeta {
            padding: 24px;
            background: #0a0a0a;
            border-top: 1px solid rgba(211, 47, 47, 0.2);
        }

        #mcat {
            color: var(--red);
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        #mtitle {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #mdesc {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        #mclose {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(17, 17, 17, 0.9);
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: all 0.2s;
            z-index: 1001;
            backdrop-filter: blur(10px);
        }
        #mclose:hover {
            background: var(--red);
            border-color: var(--red);
            transform: rotate(90deg);
        }

        /* Drive Preview Note */
        .drive-note {
            position: absolute;
            bottom: 50px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover .drive-note {
            opacity: 1;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            border-top: 1px solid rgba(211, 47, 47, 0.2);
            padding: 32px 24px;
            text-align: center;
            color: #4b5563;
            font-size: 0.85rem;
            background: rgba(5,5,5,0.9);
        }
        footer a {
            color: var(--red);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        footer a:hover { opacity: 0.7; }

        /* Responsive */
        @media (max-width: 768px) {
            .stats { grid-template-columns: 1fr; }
            #grid { grid-template-columns: 1fr; }
            .card.portrait { grid-row: span 1; }
            .hero { padding: 60px 16px 40px; }
            main { padding: 20px 16px 40px; }
        }
    </style>
</head>

        // Flatten all videos for rendering
        const ALL_VIDEOS = [
            ...VIDEO_DATA.wedding.map(v => ({...v, category: "Wedding"})),
            ...VIDEO_DATA.social.map(v => ({...v, category: "Social Media"})),
            ...VIDEO_DATA.ugc.map(v => ({...v, category: "UGC Content"})),
            ...VIDEO_DATA.commercial.map(v => ({...v, category: "Commercial"})),
            ...VIDEO_DATA.events.map(v => ({...v, category: "Events"}))
        ];

        // ============================================
        // RENDER ENGINE
        // ============================================

        let currentFilter = "All";

        // Generate floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        function getCategories() {
            const seen = { "All": true };
            const result = ["All"];
            ALL_VIDEOS.forEach(v => {
                if (!seen[v.category]) {
                    seen[v.category] = true;
                    result.push(v.category);
                }
            });
            return result;
        }

        function renderFilters() {
            const bar = document.getElementById("filter-bar");
            const cats = getCategories();
            bar.innerHTML = cats.map(c => 
                `<button class="pill ${c === 'All' ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`
            ).join('');
            document.getElementById("cat-count").textContent = cats.length - 1;
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll(".pill").forEach(p => {
                p.classList.toggle("active", p.textContent === cat);
            });
            renderGrid();
        }

        // Get thumbnail URL based on type
        function getThumbnail(video) {
            if (video.thumbnail) return video.thumbnail;
            
            if (video.type === "drive" && video.driveId) {
                // Google Drive thumbnail
                return `https://drive.google.com/thumbnail?id=${video.driveId}&sz=w1000`;
            }
            
            if (video.type === "youtube") {
                // Extract video ID from embed URL or use provided thumbnail
                if (video.thumbnail) return video.thumbnail;
                const match = video.embedUrl.match(/embed\/([^?]+)/);
                if (match) {
                    return `https://img.youtube.com/vi/${match[1]}/maxresdefault.jpg`;
                }
            }
            
            // Fallback
            return `https://placehold.co/600x400/111/333?text=${encodeURIComponent(video.title)}`;
        }

        // Get video source for modal
        function getVideoSource(video) {
            if (video.type === "drive" && video.driveId) {
                return `https://drive.google.com/file/d/${video.driveId}/preview`;
            }
            if (video.type === "youtube") {
                return video.embedUrl;
            }
            return video.src || "";
        }

        function buildThumb(v, idx) {
            const ar = v.ratio === "portrait" ? "9/16" : "16/9";
            const isPortrait = v.ratio === "portrait";
            const thumbUrl = getThumbnail(v);
            
            return `
                <div class="thumb" style="aspect-ratio:${ar};">
                    <img src="${thumbUrl}" alt="${v.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400/111/333?text=No+Preview'">
                    <div class="grad"></div>
                    <div class="cat-badge">${v.category}</div>
                    <div class="ratio-tag">${isPortrait ? '9:16' : '16:9'}</div>
                    <div class="dur-tag">${v.duration}</div>
                    ${v.type === 'drive' ? '<div class="drive-note">Google Drive</div>' : ''}
                    <div class="play-wrap">
                        <div class="play-circ">
                            <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24" style="margin-left:3px;">
                                <polygon points="5,3 19,12 5,21"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            const empty = document.getElementById("empty");
            
            const filtered = currentFilter === "All" 
                ? ALL_VIDEOS 
                : ALL_VIDEOS.filter(v => v.category === currentFilter);

            if (!filtered.length) {
                grid.innerHTML = "";
                empty.style.display = "block";
                return;
            }
            
            empty.style.display = "none";
            
            grid.innerHTML = filtered.map((v, idx) => {
                const isPortrait = v.ratio === "portrait";
                const originalIdx = ALL_VIDEOS.indexOf(v);
                return `
                    <div class="card ${isPortrait ? 'portrait' : ''}" onclick="openModal(${originalIdx})">
                        ${buildThumb(v, idx)}
                        <div class="card-body">
                            <div class="card-title">${v.title}</div>
                            <div class="card-desc">${v.description}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(idx) {
            const v = ALL_VIDEOS[idx];
            const isPortrait = v.ratio === "portrait";
            const box = document.getElementById("mbox");
            const videoContainer = document.getElementById("mvideo");

            document.getElementById("mcat").textContent = v.category;
            document.getElementById("mtitle").textContent = v.title;
            document.getElementById("mdesc").textContent = v.description;

            box.className = isPortrait ? "portrait" : "landscape";

            const src = getVideoSource(v);
            
            if (v.type === "drive") {
                // Google Drive embed
                videoContainer.innerHTML = `
                    <iframe src="${src}" allow="autoplay; fullscreen" allowfullscreen></iframe>
                `;
            } else if (v.type === "youtube") {
                videoContainer.innerHTML = `
                    <iframe src="${src}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
                `;
            } else {
                // Local file fallback
                videoContainer.innerHTML = `<video src="${v.src}" controls autoplay playsinline></video>`;
            }

            document.getElementById("modal").classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("open");
            document.getElementById("mvideo").innerHTML = "";
            document.body.style.overflow = "";
        }

        // Event listeners
        document.getElementById("modal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("modal")) closeModal();
        });
        
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeModal();
        });

        // Initialize
        createParticles();
        renderFilters();
        renderGrid();
        document.getElementById("total-count").textContent = ALL_VIDEOS.length;
    </script>
